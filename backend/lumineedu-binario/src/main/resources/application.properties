# =====================================================================
# Configuracoes padrao (base) do servico lumineedu-binario.
#
# Este arquivo e a base para todos os perfis. As configuracoes de cada
# ambiente (dev, homol, prod) vivem nos arquivos application-*
# correspondentes e sobrescrevem apenas o que precisam.
#
# Valores sensiveis (senhas, URLs de banco) utilizam variaveis de
# ambiente, com um padrao de desenvolvimento local embutido:
#   ${VAR,valor-padrao}   -> usa VAR se estiver definida, senao o padrao
# =====================================================================

spring.application.name=lumineedu-binario

# ---------------------------------------------------------------------
# Banco de dados PostgreSQL (metadados dos arquivos)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://100.119.216.123:5432/lumineedu_binario
spring.datasource.username=lumineedu
spring.datasource.password=lumineedu
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# FIX (2026-03): "No suitable driver found for postgresql://..."
# Sem persistence.xml, o Hibernate deriva a URL do PU do DataSource e remove o
# prefixo "jdbc:", produzindo "postgresql://..." que o driver rejeita. spring
# datasource.url (linha 18) ja tem o prefixo e chega ao driver corretamente, mas
# o EMF usa a chave interna do PU (nao a URL do DataSource). spring
# datasource.url sozinho nao resolve; spring.jpa.properties.jdbc.url (linha 32)
# repete a URL como chave interna do PU, evitando o stripping do "jdbc:". spring
#.jpa.properties.<k> mapeia para a propriedade do PU <k> (direto, sem conversao
# jakarta/javax). spring.jpa.properties.jakarta.persistence.jdbc.url (e
# javax.persistence.jdbc.url) NAO funcionam: getExplicitDatabaseName() nao lida
# com chaves JPA padrao. spring.datasource.url fica inalterado (ja tem o prefixo).
spring.jpa.properties.jdbc.url=jdbc:postgresql://100.119.216.123:5432/lumineedu_binario
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Armazenamento fisico de arquivos em disco local
# ---------------------------------------------------------------------
app.storage.diretorio=./armazenamento
app.storage.subdiretorio=arquivos
app.storage.max-tamanho-bytes=52428800
app.storage.max-tamanho-hd-bytes=1073741824
# Periodo maximo (em dias) que um arquivo deve ser acessado para nao ser
# considerado candidato a limpeza. Arquivos sem acesso (ou com ultima
# leitura) mais antigos que este periodo passam a ser excluidos do SO e
# marcados como inativos no banco. Base: 730 dias (2 anos).
app.storage.max-idle-dias=730
# Hora (0-23) de execucao do Job de limpeza periodica (1x por dia).
app.storage.hora-execucao-limpeza=3

# Tokens validos aceitos na cabecalho (Bearer-Token ou X-API-TOKEN)
app.security.tokens-validos=token-secreto-lumine,admin-token,lumine-key

# Tipos mime permitidos para upload (somente imagens de uso comum)
app.security.mime-tipos-permitidos=image/jpeg,image/jpg,image/png,image/gif,image/webp,image/bmp

# ---------------------------------------------------------------------
# Servidor HTTP
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
# Endpoints REST de arquivos
# ---------------------------------------------------------------------
app.api.prefix=/api/arquivos

# ---------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------
logging.level.com.lumineedu.binario=INFO
logging.level.org.springframework.security=INFO
