# Configuracoes de ambiente de desenvolvimento.
spring.profiles.active=dev

# Carrega os dados iniciais de exemplo (data.sql) apenas no dev.
spring.sql.init.mode=always

spring.datasource.url=${DB_URL,jdbc:postgresql://localhost:5432/lumineedu_binario}
spring.datasource.username=${DB_USERNAME,lumineedu}
spring.datasource.password=${DB_PASSWORD,lumineedu}
# FIX (2026-03): "No suitable driver found for postgresql://..."
# Sem persistence.xml, o Hibernate deriva a URL do PU do DataSource e remove o
# prefixo "jdbc:", produzindo "postgresql://..." que o driver rejeita. spring
# datasource.url (linha 7) ja tem o prefixo e chega ao driver corretamente, mas
# o EMF usa a chave interna do PU (nao a URL do DataSource). spring
# datasource.url sozinho nao resolve; spring.jpa.properties.jdbc.url (linha 15)
# repete a URL como chave interna do PU, evitando o stripping do "jdbc:". spring
#.jpa.properties.<k> mapeia para a propriedade do PU <k> (direto, sem conversao
# jakarta/javax). spring.jpa.properties.jakarta.persistence.jdbc.url (e
# javax.persistence.jdbc.url) NAO funcionam: getExplicitDatabaseName() nao lida
# com chaves JPA padrao. spring.datasource.url fica inalterado (ja tem o prefixo).
spring.jpa.properties.jdbc.url=${DB_URL,jdbc:postgresql://localhost:5432/lumineedu_binario}

app.storage.diretorio=./armazenamento-dev
app.storage.subdiretorio=arquivos
app.storage.max-tamanho-bytes=10485760
app.storage.max-tamanho-hd-bytes=2147483648

app.security.tokens-validos=token-secreto-lumine,admin-token,lumine-key
app.security.mime-tipos-permitidos=image/jpeg,image/jpg,image/png,image/gif,image/webp,image/bmp

server.port=8080

logging.level.com.lumineedu.binario=DEBUG
