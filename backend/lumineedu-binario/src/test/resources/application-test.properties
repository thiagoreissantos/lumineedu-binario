# =====================================================================
# Configuracoes de suporte aos testes de integracao.
#
# Spring Boot 3.3 nao permite definir spring.profiles.active dentro de um
# arquivo de perfil especifico (application-*.properties), entao este arquivo
# NAO ativa nenhum perfil extra. As configuracoes de seguranga (tokens validos
# e tipos mime permitidos) ja estao na base application.properties e sao
# compartilhadas; o banco de dados isolado e o diretorio de armazenamento
# fisico isolado sao sobrescritos aqui e por classe de teste.
#
# O diretorio de armazenamento fisico e sobrescrito por classe de teste antes
# da construcao do contexto (propriedade de sistema, prioridade mais alta que
# os arquivos .properties do contexto de aplicacao).
#
# Nenhuma camada e mockada: controller -> seguranca -> servico ->
# repositorio -> PostgreSQL real -> sistema de arquivos real.
# =====================================================================

# Banco de dados PostgreSQL isolado para os testes de integracao.
spring.datasource.url=${TEST_DB_URL,jdbc:postgresql://127.0.0.1:5432/lumineedu_binario_homol_test}
spring.datasource.username=${TEST_DB_USERNAME,lumineedu}
spring.datasource.password=${TEST_DB_PASSWORD,lumineedu}
spring.datasource.driver-class-name=org.postgresql.Driver

# TEST (EMPYRICAL v2): Hibernate-internal PU key jdbc.url (via
# spring.jpa.properties.jdbc.url). Hibernate 6.5 EMF resolve a URL do PU
# via getExplicitDatabaseName (reads PU key "jdbc.url"), NOT the DataSource.
spring.jpa.properties.jdbc.url=${TEST_DB_URL,jdbc:postgresql://127.0.0.1:5432/lumineedu_binario_homol_test}

# Schema descartavel: limpo no inicio de cada execucao de teste.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Servidor em porta aleatoria (contexto web real).
server.port=0
