# =====================================================================
# Configuracoes de suporte aos testes de integracao.
#
# Ativa o perfil de homologacao (homol) e sobrescreve apenas o que os
# testes precisam: banco de dados isolado, schema descartavel e um
# diretorio de armazenamento fisico isolado. O diretorio de armazenamento
# e sobrescrito por classe de teste via @DynamicPropertySource (isolado por
# classe) no arquivo de base de teste.
#
# Nenhuma camada e mockada: controller -> seguranca -> servico ->
# repositorio -> PostgreSQL real -> sistema de arquivos real.
# =====================================================================

# Ativa o perfil de homologacao (tokens validos, tipos mime, etc.).
spring.profiles.active=homol

# Banco de dados PostgreSQL isolado para os testes de integracao.
spring.datasource.url=${TEST_DB_URL,jdbc:postgresql://127.0.0.1:5432/lumineedu_binario_homol_test}
spring.datasource.username=${TEST_DB_USERNAME,lumineedu}
spring.datasource.password=${TEST_DB_PASSWORD,lumineedu}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema descartavel: limpo no inicio de cada execucao de teste.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Servidor em porta aleatoria (contexto web real).
server.port=0
