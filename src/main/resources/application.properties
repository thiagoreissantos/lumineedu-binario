# =====================================================================
# Configuracoes padrao do servico lumineedu-binario
# =====================================================================

spring.application.name=lumineedu-binario

# ---------------------------------------------------------------------
# Banco de dados PostgreSQL (metadados dos arquivos)
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/lumineedu_binario
spring.datasource.username=lumineedu
spring.datasource.password=lumineedu
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Armazenamento fisico de arquivos em disco local
# ---------------------------------------------------------------------
app.storage.diretorio=./armazenamento
app.storage.subdiretorio=arquivos
app.storage.max-tamanho-bytes=52428800
app.storage.max-tamanho-hd-bytes=1073741824

# Tokens validos aceitos na cabecalho (Bearer-Token ou X-API-TOKEN)
app.security.tokens-validos=token-secreto-lumine,admin-token,lumine-key

# Tipos mime permitidos para upload (somente imagens de uso comum)
app.security.mime-tipos-permitidos=image/jpeg,image/jpg,image/png,image/gif,image/webp,image/bmp

# ---------------------------------------------------------------------
# Servidor HTTP
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
# Endpoints REST de arquivos
# ---------------------------------------------------------------------
app.api.prefix=/api/arquivos

# ---------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------
logging.level.com.lumineedu.binario=INFO
logging.level.org.springframework.security=INFO
