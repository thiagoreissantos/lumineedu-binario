# =====================================================================
# Ambiente de PRODUCAO
#
# Consumido quando SPRING_PROFILES_ACTIVE=prod (variavel de ambiente)
# ou --spring.profiles.active=prod.
#
# Senhas e URLs de banco de dados vem de variaveis de ambiente (nunca
# embutidas aqui). O diretorio de armazenamento e absoluto: o container
# cria e possui o diretorio antes de iniciar a aplicacao.
# =====================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Em producao o schema e gerido externamente; o JPA apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Armazenamento fisico em diretorio absoluto (criado no Dockerfile).
app.storage.diretorio=${STORAGE_DIR,/var/app/lumineedu/binario/storage}
app.storage.subdiretorio=arquivos
app.storage.max-tamanho-bytes=104857600
app.storage.max-tamanho-hd-bytes=2147483648

# Tokens validos aceitos na cabecalho (Bearer-Token ou X-API-TOKEN)
app.security.tokens-validos=${SECURITY_TOKENS_VALIDOS,token-secreto-lumine,admin-token,lumine-key}
app.security.mime-tipos-permitidos=image/jpeg,image/jpg,image/png,image/gif,image/webp,image/bmp

server.port=8080
app.api.prefix=/api/arquivos

# Niveis de log mais restritos em producao.
logging.level.com.lumineedu.binario=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
