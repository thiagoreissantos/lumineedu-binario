spring.application.name=lumineedu-binario-frontend

# Porta do servidor da interface web.
server.port=8081

# URL base da API REST do backend. Nao e hardcoded: configure por variavel de ambiente.
app.backend.url=http://localhost:8080

# Credenciais de acesso da interface (configuraveis via application-{profile}.properties).
app.security.username=admin
app.security.password=123456

# Nome exibido no rodape e cabecalho da interface.
app.ui.name=LumineEdu Binário
